pekko {
  loglevel = "INFO"
  stdout-loglevel = "INFO"

  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
  log-dead-letters-during-shutdown = off
  log-dead-letters = 5

  actor {
    # local-only — no cluster needed for SimEDaPE
    provider = local

    allow-java-serialization = off

    serializers {
      jackson-cbor = "org.apache.pekko.serialization.jackson.JacksonCborSerializer"
    }

    serialization-bindings {
      "org.interscity.htc.core.Protocol$PipelineEvent"   = jackson-cbor
      "org.interscity.htc.core.Protocol$PipelineCommand" = jackson-cbor
    }

    # Dispatcher for blocking I/O (JDBC calls to ClickHouse, file reads)
    io-dispatcher {
      type = "Dispatcher"
      executor = "thread-pool-executor"
      thread-pool-executor {
        fixed-pool-size = 16
      }
      throughput = 1
    }

    # Dispatcher for CPU-bound work (DTW computation, KShape)
    compute-dispatcher {
      type = "Dispatcher"
      executor = "fork-join-executor"
      fork-join-executor {
        parallelism-min    = 4
        parallelism-factor = 2.0
        parallelism-max    = 32
      }
      throughput = 10
    }

    debug {
      receive     = off
      lifecycle   = off
      unhandled   = off
      autoreceive = off
    }
  }
}

# ─── SimEDaPE pipeline configuration ─────────────────────────────────────────

simedape {
  base-simulation-id    = "base-2017"
  base-simulation-id    = ${?SIMEDAPE_BASE_SIM_ID}
  partial-simulation-id = "partial-2017"
  partial-simulation-id = ${?SIMEDAPE_PARTIAL_SIM_ID}
  output-simulation-id  = "estimated-2017"
  output-simulation-id  = ${?SIMEDAPE_OUTPUT_SIM_ID}

  n-clusters       = 64
  n-clusters       = ${?SIMEDAPE_N_CLUSTERS}
  kshape-max-iter  = 100
  kshape-n-init    = 3

  series-length  = 24
  interval-size  = 3600

  # Options: Base | Avg | WAvg | Sample | PCA
  estimation-method = "WAvg"
  percent-sample    = 10.0

  dtw-window-fraction = 0.10

  pca-components = 8

  # Options: "file" | "clickhouse"
  data-source = "clickhouse"
  data-source = ${?SIMEDAPE_DATA_SOURCE}
  data-dir    = "/data/simulations"
  data-dir    = ${?SIMEDAPE_DATA_DIR}

  warping-paths-dir = "/tmp/simedape/warping_paths"
  warping-paths-dir = ${?SIMEDAPE_WARPING_PATHS_DIR}

  checkpoint-dir    = "/tmp/simedape/checkpoints"
  checkpoint-dir    = ${?SIMEDAPE_CHECKPOINT_DIR}

  worker-parallelism = 8

  clickhouse {
    host      = "localhost"
    host      = ${?SIMEDAPE_CH_HOST}
    port      = 8123
    port      = ${?SIMEDAPE_CH_PORT}
    database  = "htc"
    database  = ${?SIMEDAPE_CH_DATABASE}
    user      = "default"
    user      = ${?SIMEDAPE_CH_USER}
    password  = ""
    password  = ${?SIMEDAPE_CH_PASSWORD}
    pool-size = 8
    pool-size = ${?SIMEDAPE_CH_POOL_SIZE}
  }

  # REST API
  http {
    host       = "0.0.0.0"
    port       = 9000
    port       = ${?SIMEDAPE_HTTP_PORT}
    # Set to true to start the pipeline automatically at launch (no HTTP trigger needed)
    auto-start = false
    auto-start = ${?SIMEDAPE_AUTO_START}
  }

  # ── Estimation validation ──────────────────────────────────────────────────
  #
  # validation.mode controls whether the estimated output is compared against
  # a known ground-truth simulation after each pipeline run.
  #
  #  Disabled         : no validation (default — fastest)
  #
  #  AgainstBase      : compare estimated non-simulated links vs the BASE
  #                     simulation.  Tests estimation quality in an unmodified
  #                     scenario (reference is already in memory — free).
  #
  #  AgainstReference : compare against an independently-run FULL simulation
  #                     (e.g. the complete modified scenario).  Requires
  #                     reference-id to point to a loaded simulation.
  #                     Use this to measure how well estimation captures
  #                     scenario modifications ("com modificações").
  #
  validation {
    mode         = "Disabled"  # Disabled | AgainstBase | AgainstReference
    mode         = ${?SIMEDAPE_VALIDATION_MODE}
    reference-id = ""          # simulation ID for AgainstReference mode
    reference-id = ${?SIMEDAPE_VALIDATION_REF_ID}
  }
}
