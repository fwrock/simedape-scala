# SimEDaPE — Docker Compose
#
# O ClickHouse do simulador usa `network_mode: host`, ou seja, está vinculado
# diretamente à interface de rede do host (acessível em localhost:8123 no host).
#
# Para que este container alcance o host a partir de dentro do Docker, usamos
# `extra_hosts: host.docker.internal:host-gateway` — suportado nativamente no
# Docker Engine para Linux a partir da versão 20.10.
#
# ── Setup rápido ──────────────────────────────────────────────────────────────
#
#  1. Copie .env.example → .env e ajuste os valores (se necessário).
#
#  2. Suba:
#       docker compose up -d
#
# ─────────────────────────────────────────────────────────────────────────────

services:
  simedape:
    image: simedape:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simedape
    restart: unless-stopped

    ports:
      - "${SIMEDAPE_HTTP_PORT:-9000}:9000"

    environment:
      # ── ClickHouse do simulador (network_mode: host) ──────────────────────
      # O ClickHouse está no host — acessível via host.docker.internal:8123.
      # `host-gateway` é resolvido pelo Docker Engine para o IP do host.
      SIMEDAPE_CH_HOST:      "${SIMEDAPE_CH_HOST:-host.docker.internal}"
      SIMEDAPE_CH_PORT:      "${SIMEDAPE_CH_PORT:-8123}"
      SIMEDAPE_CH_DATABASE:  "${SIMEDAPE_CH_DATABASE:-htc}"
      SIMEDAPE_CH_USER:      "${SIMEDAPE_CH_USER:-default}"
      SIMEDAPE_CH_PASSWORD:  "${SIMEDAPE_CH_PASSWORD:-}"
      SIMEDAPE_CH_POOL_SIZE: "${SIMEDAPE_CH_POOL_SIZE:-8}"

      # ── Pipeline ──────────────────────────────────────────────────────────
      SIMEDAPE_DATA_SOURCE:      "${SIMEDAPE_DATA_SOURCE:-clickhouse}"
      SIMEDAPE_BASE_SIM_ID:      "${SIMEDAPE_BASE_SIM_ID:-base-2017}"
      SIMEDAPE_PARTIAL_SIM_ID:   "${SIMEDAPE_PARTIAL_SIM_ID:-partial-2017}"
      SIMEDAPE_OUTPUT_SIM_ID:    "${SIMEDAPE_OUTPUT_SIM_ID:-estimated-2017}"
      SIMEDAPE_N_CLUSTERS:       "${SIMEDAPE_N_CLUSTERS:-64}"
      SIMEDAPE_WARPING_PATHS_DIR: /tmp/simedape/warping_paths

      # ── Validação ─────────────────────────────────────────────────────────
      # Disabled | AgainstBase | AgainstReference
      SIMEDAPE_VALIDATION_MODE:   "${SIMEDAPE_VALIDATION_MODE:-Disabled}"
      SIMEDAPE_VALIDATION_REF_ID: "${SIMEDAPE_VALIDATION_REF_ID:-}"

      # ── HTTP ──────────────────────────────────────────────────────────────
      SIMEDAPE_HTTP_PORT: 9000
      SIMEDAPE_AUTO_START: "${SIMEDAPE_AUTO_START:-false}"

    volumes:
      # Cache de warping paths entre runs (acelera reruns no mesmo cenário)
      - simedape_warping_paths:/tmp/simedape/warping_paths
      # Dados de simulação em ficheiros (apenas para data-source=file)
      - "${SIMEDAPE_DATA_DIR:-./data}:/data/simulations"

    # Permite que o container resolva "host.docker.internal" para o IP do host.
    # Necessário no Linux para alcançar serviços com network_mode: host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - simedape_internal

    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s    # tempo para JVM + Pekko inicializarem

    # Limite de recursos (ajuste conforme o servidor)
    deploy:
      resources:
        limits:
          cpus:   "4.0"
          memory: "4g"
        reservations:
          cpus:   "1.0"
          memory: "512m"

# ── Redes ─────────────────────────────────────────────────────────────────────
networks:
  simedape_internal:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  simedape_warping_paths:
    driver: local
